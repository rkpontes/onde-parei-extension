<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onde Parei?</title><link rel="stylesheet" href="styles.css"></head><body><div id="app"><header><div><h1>Onde Parei<span>?</span></h1><small>Mangás e animes no seu ritmo</small></div><button id="add" class="primary">+ Nova obra</button></header><nav><button data-page="library" class="selected">Biblioteca</button><button data-page="history">Histórico</button><button data-page="settings">Dados</button></nav><main id="main"></main></div><dialog id="editor"><form id="work-form"><div class="dialog-title"><h2 id="editor-title">Nova obra</h2><button type="button" id="close-editor" class="plain">✕</button></div><input type="hidden" id="work-id"><label>Título <input id="title" maxlength="150" required placeholder="Ex.: Solo Max-Level Newbie"></label><div class="two"><label>Tipo<select id="type"><option value="manga">Mangá / Manhwa</option><option value="anime">Anime</option></select></label><label>Status<select id="status"><option value="ongoing">Acompanhando</option><option value="planned">Quero ver/ler</option><option value="paused">Pausado</option><option value="completed">Concluído</option><option value="dropped">Abandonado</option></select></label></div><label>Link principal <input id="url" type="url" placeholder="https://..." required></label><div class="two"><label>Último concluído <input id="progress" type="number" min="0" step="1" value="0"></label><label>Total (opcional) <input id="total" type="number" min="0" step="1" placeholder="Desconhecido"></label></div><label>Tags (separadas por vírgula) <input id="tags" placeholder="Ação, Aventura"></label><label>Observações <textarea id="notes" rows="2" maxlength="2000"></textarea></label><div class="actions"><button type="button" id="use-tab">Usar aba atual</button><button type="submit" class="primary">Salvar obra</button></div><p id="form-error" role="alert"></p></form></dialog><script src="popup.js" defer></script></body></html>
